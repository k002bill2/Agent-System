apiVersion: apps/v1
kind: Deployment
metadata:
  name: aos-backend
  namespace: aos
  labels:
    app.kubernetes.io/name: aos
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aos
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aos
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: aos-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: aos-config
            - secretRef:
                name: aos-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              # 프로세스 생존만 확인 (의존성 미검사) — DB 장애 시 재시작 루프 방지
              path: /health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              # 트래픽 수용 가능 여부 (핵심 의존성 검사)
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
