# Agent Orchestration Service - Docker Compose (Production/Self-hosted)
# Usage: docker compose up -d
# Dashboard: http://localhost:5173
# API: http://localhost:8000

name: aos

services:
  # React Dashboard (Nginx)
  dashboard:
    image: 002bill/aos-dashboard:latest
    build:
      context: ./src/dashboard
      dockerfile: Dockerfile.prod
    container_name: aos-dashboard
    ports:
      - "${DASHBOARD_BIND_HOST:-127.0.0.1}:${DASHBOARD_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aos-network
    restart: unless-stopped

  # FastAPI Backend
  backend:
    image: 002bill/aos-backend:latest
    build:
      context: ./src/backend
      dockerfile: Dockerfile.full
    container_name: aos-backend
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    environment:
      # Database (URL built from POSTGRES_* in .env; password is required)
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-aos}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD or run ./setup.sh}@postgres:5432/${POSTGRES_DB:-aos}
      - USE_DATABASE=true
      - ENABLE_API_DOCS=${ENABLE_API_DOCS:-false}
      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
      # Qdrant
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:?set QDRANT_API_KEY}
      # LLM Provider (set in .env)
      - LLM_PROVIDER=${LLM_PROVIDER:-codex_cli}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Docker에서는 항상 host.docker.internal 사용 (.env의 localhost 무시)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # OAuth (optional)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      # JWT (required — run ./setup.sh to auto-generate)
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:?set SESSION_SECRET_KEY or run ./setup.sh}
      # First-admin bootstrap (comma-separated emails)
      - SUPER_ADMIN_EMAILS=${SUPER_ADMIN_EMAILS:-}
      # Frontend URL & CORS — set to the externally reachable URL for remote self-host
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      # Claude Code paths (inside container)
      - CLAUDE_HOME=/home/aos/.claude
      - CLAUDE_PROJECTS_PATH=/home/aos/.claude/projects
    volumes:
      # ChromaDB persistence
      - chromadb_data:/app/data/chromadb
      # Summary cache (writable)
      - summary_cache:/app/data/summaries
      # NOTE: host ~/.claude and ~/.warp mounts (Claude Code usage monitoring +
      # Warp sync) are maintainer-local and live in docker-compose.override.yml,
      # which Compose auto-merges on that machine only. See docs/self-host-quickstart.md.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - aos-network
    healthcheck:
      # readiness 시맨틱 — 핵심 의존성 검사 (unready 시 unhealthy, 의존 서비스 게이팅)
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: aos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD or run ./setup.sh}
      POSTGRES_DB: ${POSTGRES_DB:-aos}
    volumes:
      - ./infra/docker/data/postgres:/var/lib/postgresql/data
      # Note: SQLAlchemy auto-creates tables on startup
      # - ./infra/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${PG_BIND_HOST:-127.0.0.1}:${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aos} -d ${POSTGRES_DB:-aos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aos-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: aos-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aos-network
    restart: unless-stopped

  # Qdrant Vector Database (for RAG)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aos-qdrant
    ports:
      - "${QDRANT_BIND_HOST:-127.0.0.1}:${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_BIND_HOST:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - aos-network
    restart: unless-stopped

  # Sandbox (for isolated code execution)
  # Built as separate image, containers created dynamically
  sandbox:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.sandbox
    image: aos-sandbox:latest
    container_name: aos-sandbox-builder
    profiles:
      - build-only
    # Note: This service only builds the image
    # Actual sandbox containers are created by sandbox_manager.py

volumes:
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  chromadb_data:
    driver: local
  summary_cache:
    driver: local

networks:
  aos-network:
    driver: bridge
